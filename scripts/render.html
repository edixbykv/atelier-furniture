<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}#c{display:block}</style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const W = 1280, H = 1600;            // portrait, tall wardrobe
    const DPR = 1.5;                      // 1920 x 2400 output
    const canvas = document.getElementById('c');
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, alpha: true, preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    scene.background = null;

    // Premium environment lighting (soft studio reflections)
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

    // Lights — warm key, cool fill, rim
    const key = new THREE.DirectionalLight(0xfff2e6, 2.6);
    key.position.set(5, 8, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.bias = -0.0005;
    key.shadow.camera.near = 0.5; key.shadow.camera.far = 40;
    key.shadow.camera.left = -8; key.shadow.camera.right = 8;
    key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xe8f0ff, 1.0);
    fill.position.set(-6, 4, 3);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 1.4);
    rim.position.set(0, 5, -7);
    scene.add(rim);

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    // Soft contact shadow catcher (composites onto transparency)
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.28 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), shadowMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const TARGET = 5; // world size to normalize the longest dimension to
    let pivot = new THREE.Group();
    scene.add(pivot);

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    window.__ready = false;
    window.__error = null;

    loader.load('/scripts/wardrobe-opt.glb', (gltf) => {
      const model = gltf.scene;
      model.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true; o.receiveShadow = true;
          if (o.material) {
            o.material.envMapIntensity = 1.1;
          }
        }
      });

      // Auto-frame: recenter + scale so longest axis == TARGET, sit on ground
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const s = TARGET / maxDim;
      model.scale.setScalar(s);
      // recompute after scale
      model.position.set(-center.x * s, -box.min.y * s, -center.z * s);
      pivot.add(model);

      // expose normalized height for camera framing
      window.__modelHeight = size.y * s;
      window.__ready = true;
    }, undefined, (err) => { window.__error = String(err); });

    // Camera presets — set by puppeteer via window.__setView(name)
    const h = () => window.__modelHeight || TARGET;
    window.__setView = (cfg) => {
      const yaw = (cfg.yaw ?? 25) * Math.PI / 180;
      const pitch = (cfg.pitch ?? 8) * Math.PI / 180;
      const dist = cfg.dist ?? 9;
      const ty = (cfg.targetY ?? 0.5) * h();
      const cx = Math.sin(yaw) * Math.cos(pitch) * dist;
      const cz = Math.cos(yaw) * Math.cos(pitch) * dist;
      const cy = Math.sin(pitch) * dist + ty;
      camera.position.set(cx, cy, cz);
      camera.lookAt(0, ty, 0);
      camera.fov = cfg.fov ?? 32;
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);
    };

    function loop() {
      if (window.__ready) renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
